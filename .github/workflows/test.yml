name: Unit tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# Ensures that we cancel running jobs for the same PR / same workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install nightly
      uses: actions-rs/toolchain@v1
      with:
            toolchain: nightly
            profile: minimal
            components: rustfmt
    - name: Install nightly
      uses: actions-rs/toolchain@v1
      with:
            toolchain: nightly
            profile: minimal
            components: clippy

    - uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo +nightly fmt --all -- --check

    - name: Check Compilation
      run: cargo +nightly build --all-features


    - name: Check Bench Compilation
      run: cargo +nightly bench --no-run --profile=dev --all-features

    - uses: actions-rs/clippy-check@v1
      with:
        toolchain: nightly
        token: ${{ secrets.GITHUB_TOKEN }}
        args: --tests

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain:
          - stable
          - nightly
        features:
          - { label: "all", flags: "mmap,stopwords,lz4-compression,zstd-compression,failpoints,stemmer,vector" }
          - { label: "quickwit", flags: "mmap,quickwit,failpoints" }
          - { label: "none", flags: "" }

    name: test-${{ matrix.toolchain }}-${{ matrix.features.label}}

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: actions-rs/toolchain@v1
      with:
            toolchain: ${{ matrix.toolchain }}
            profile: minimal
            override: true

    - uses: taiki-e/install-action@nextest
    - uses: Swatinem/rust-cache@v2

    - name: Resolve feature flags
      id: features
      run: |
        FLAGS="${{ matrix.features.flags }}"
        if [[ "${{ matrix.toolchain }}" == "nightly" && "$FLAGS" == *"vector"* ]]; then
          FLAGS="${FLAGS},vector-simd"
        fi
        echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

    - name: Run tests
      run: |
        FLAGS="${{ steps.features.outputs.flags }}"
        if [ -z "$FLAGS" ]; then
          cargo nextest run --lib --no-default-features --verbose --workspace
        else
          cargo nextest run --features "$FLAGS" --no-default-features --verbose --workspace
        fi

    - name: Run doctests
      run: |
        FLAGS="${{ steps.features.outputs.flags }}"
        if [ -z "$FLAGS" ]; then
          echo "no doctest for no feature flag"
        else
          cargo test --doc --features "$FLAGS" --verbose --workspace
        fi
